name: Build PKG

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # June 2026 toolchain (GCC 7.2 + binutils 2.22) - tested working on a real PS3.
          # The newer nightly (GCC 13 + binutils 2.42) hangs the RSX on real hardware.
          - tools: june
            toolchain_tag: "2026-06-09"
            libraries_tag: "nightly-2026-06-16"
            psl1ght_ref: b55429b
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev
    steps:
      - uses: actions/checkout@v4

      - name: Install build requirements
        run: |
          for i in 1 2 3; do sudo apt-get update && break; sleep 15; done
          PKGS="gcc libelf-dev autoconf automake bison flex make cmake texinfo patch wget zlib1g-dev libtool-bin bzip2 pkg-config libssl-dev libgmp-dev"
          for i in 1 2 3; do sudo apt-get -y --fix-missing install $PKGS && break; sleep 20; sudo apt-get update; done

      - name: Add toolchain to PATH
        run: echo "$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin" >> $GITHUB_PATH

      - name: Week number (cache key)
        id: week
        run: echo "w=$(date -u +%G-%V)" >> $GITHUB_OUTPUT

      - name: Cache PS3 SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ps3dev
          key: ps3sdk-${{ matrix.tools }}-${{ runner.os }}-${{ steps.week.outputs.w }}-v2

      - name: Download PS3 toolchain
        if: steps.sdk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ matrix.toolchain_tag }}" ]; then
            assets=$(gh api repos/ps3dev/ps3toolchain/releases/tags/${{ matrix.toolchain_tag }} --jq '.assets[] | "\(.name) \(.browser_download_url)"')
          else
            assets=$(gh api repos/ps3dev/ps3toolchain/releases --jq '[.[] | select(.prerelease and (.draft|not))] | sort_by(.published_at) | reverse | .[0].assets[] | "\(.name) \(.browser_download_url)"')
          fi
          echo "$assets"
          url=$(echo "$assets" | grep -i 'linux\|ubuntu' | grep -iv 'arm\|aarch' | grep 'tar' | head -1 | cut -d' ' -f2)
          echo "Toolchain: $url"; test -n "$url"
          curl -sL "$url" | tar xz -C "$GITHUB_WORKSPACE"
          ls "$PS3DEV"; ppu-gcc --version | head -1; ppu-ld --version | head -1

      - name: Build PSL1GHT SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/psl1ght
          git clone https://github.com/ps3dev/PSL1GHT.git /tmp/psl1ght
          git -C /tmp/psl1ght checkout ${{ matrix.psl1ght_ref }}
          cd /tmp/psl1ght
          make install-ctrl
          make -j"$(nproc)"
          make install

      - name: Add libraries (ps3libraries)
        if: steps.sdk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ matrix.libraries_tag }}" ]; then
            assets=$(gh api repos/ps3dev/ps3libraries/releases/tags/${{ matrix.libraries_tag }} --jq '.assets[] | "\(.name) \(.browser_download_url)"')
          else
            assets=$(gh api repos/ps3dev/ps3libraries/releases --jq '[.[] | select(.prerelease and (.draft|not))] | sort_by(.published_at) | reverse | .[0].assets[] | "\(.name) \(.browser_download_url)"')
          fi
          echo "$assets"
          url=$(echo "$assets" | grep -i 'linux\|ubuntu' | grep -iv 'arm\|aarch' | grep tar | head -1 | cut -d' ' -f2)
          echo "Libraries: $url"; test -n "$url"
          curl -sL "$url" | tar xz -C "$PSL1GHT"
          ls "$PSL1GHT/portlibs/ppu/lib" | grep -i "freetype\|tiny3d\|font3d"

      - name: Build Tiny3D (with callback hardening)
        run: |
          rm -rf /tmp/tiny3d
          git clone --depth 1 https://github.com/wargio/tiny3d /tmp/tiny3d
          python3 tools/fix_tiny3d.py /tmp/tiny3d/lib/source/buffer.c
          make -C /tmp/tiny3d/lib install
          make -C /tmp/tiny3d/libfont install

      - name: Build dashboard PKG
        run: |
          make clean || true
          make pkg TOOLSET=${{ matrix.tools }}
          mkdir -p out
          cp PS_Dashboard.pkg out/PS_Dashboard.pkg
          ls -la out

      - name: Upload PKGs
        uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.tools }}
          path: out/*.pkg

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/*.pkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" --prerelease \
            --notes "Install PS_Dashboard.pkg with the PS3 Package Installer. Built with the June 2026 PS3 toolchain (GCC 7.2)."
